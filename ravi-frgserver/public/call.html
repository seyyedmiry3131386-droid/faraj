<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>تماس اضطراری</title>
<style>
 :root{color-scheme:light dark;--bg:#f6f7f6;--ink:#17231e;--card:#fff;--line:rgba(0,0,0,.12);--accent:#1f4a3a}
 @media (prefers-color-scheme:dark){:root{--bg:#101513;--ink:#e8efe9;--card:#18201c;--line:rgba(255,255,255,.14);--accent:#7fc3a4}}
 *{box-sizing:border-box}
 body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;padding:24px}
 main{width:min(360px,100%);text-align:center;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 22px}
 h1{font-size:1.05rem;margin:0 0 6px;font-weight:600}
 p{margin:0 0 22px;opacity:.75;line-height:1.8;font-size:.95rem}
 a.call[hidden]{display:none}
 a.call{display:block;padding:18px;border-radius:16px;background:var(--accent);color:#fff;text-decoration:none;font-size:2.4rem;font-weight:700;letter-spacing:.06em}
 @media (prefers-color-scheme:dark){a.call{color:#0c1511}}
 small{display:block;margin-top:14px;opacity:.6}
</style>
</head>
<body>
<main>
 <h1 id="name">تماس اضطراری</h1>
 <p id="help">روی شماره بزنید تا شماره‌گیر تلفن باز شود؛ سپس خودتان تماس را برقرار کنید.</p>
 <a class="call" id="call" hidden></a>
 <small>اگر شماره‌گیر باز نشد، شماره را دستی در برنامهٔ تلفن وارد کنید.</small>
</main>
<script src="/call.js" defer></script>
</body>
</html>
