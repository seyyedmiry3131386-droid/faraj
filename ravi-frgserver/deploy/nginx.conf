# Example only. Obtain HTTPS certificates for both hostnames before enabling
# central intake. Restrict access to the staff host further by VPN/IP if possible.
limit_req_zone $binary_remote_addr zone=ravi_api:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ravi_staff_login:10m rate=6r/m;
# Do not log query strings, submission keys, report IDs or request bodies.
# IP addresses remain operational metadata and require a retention policy.
log_format ravi_meta '$remote_addr [$time_iso8601] "$request_method" $status $body_bytes_sent $request_time';
server {
    listen 80;
    server_name frgserver.ir www.frgserver.ir;
    access_log /var/log/nginx/ravi-access.log ravi_meta;
    if ($host = www.frgserver.ir) { return 301 https://frgserver.ir$request_uri; }
    client_max_body_size 26m;
    client_body_timeout 120s;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # Permit opt-in recording, location and the system camera picker. In an
    # embedded WebView the host must also delegate the required permissions.
    add_header Permissions-Policy "microphone=(self), camera=(self), geolocation=(self)" always;
    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 100s;
    }
    location = /api/central/reports {
        limit_req zone=ravi_api burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 101m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 960s;
        proxy_send_timeout 120s;
    }
    location /api/ {
        limit_req zone=ravi_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 310s;
    }
}
server {
    listen 80;
    server_name admin.frgserver.ir;
    access_log /var/log/nginx/ravi-access.log ravi_meta;
    client_max_body_size 32k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location = /api/staff/login {
        limit_req zone=ravi_staff_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 310s;
    }
}
